<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1560"
 role="img" aria-labelledby="svg-title svg-desc" preserveAspectRatio="xMidYMid meet">
<title id="svg-title">Partes de un motor de corriente continua con escobillas</title>
<desc id="svg-desc">Tres vistas coordinadas. La vista transversal muestra el estátor, el rotor, el eje visto de frente y dos tramos del devanado paralelos al eje, representados por sus secciones. La vista oblicua muestra la bobina completa sobre el rotor y relaciona sus lados largos A y B con el plano de corte. La vista longitudinal amplía el colector partido, las escobillas y los bornes.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#752933"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#3d6694"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#417e72"/>
  </marker>
  <pattern id="hatch-n" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="12" height="12" fill="#eff3f8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#3d6694" stroke-width="3"/>
  </pattern>
  <pattern id="hatch-s" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="12" height="12" fill="#f8eff0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#943d48" stroke-width="3"/>
  </pattern>
</defs>
<style>
  text { font-family: "Atkinson Hyperlegible", Arial, sans-serif; fill: #20252b; }
  .title { font-size: 38px; font-weight: 700; }
  .panel-title { font-size: 29px; font-weight: 700; }
  .label { font-size: 25px; font-weight: 600; }
  .body { font-size: 23px; }
  .small { font-size: 20px; }
  .tiny { font-size: 18px; }
  .wire { fill: none; stroke: #20252b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .component { fill: #ffffff; stroke: #20252b; stroke-width: 5; }
  .accent { fill: #f8eff0; stroke: #752933; stroke-width: 5; }
  .blue { fill: #eff3f8; stroke: #3d6694; stroke-width: 5; }
  .teal { fill: #f0f7f6; stroke: #417e72; stroke-width: 5; }
  .panel { fill: #ffffff; stroke: #e4c8cc; stroke-width: 4; }
  .leader { fill: none; stroke: #59636e; stroke-width: 3; stroke-linecap: round; }
  .arrow { fill: none; stroke: #752933; stroke-width: 6; marker-end: url(#arrow); }
  .arrow-blue { fill: none; stroke: #3d6694; stroke-width: 6; marker-end: url(#arrow-blue); }
  .arrow-teal { fill: none; stroke: #417e72; stroke-width: 6; marker-end: url(#arrow-teal); }
  .control { fill: none; stroke: #3d6694; stroke-width: 4; stroke-dasharray: 13 10; marker-end: url(#arrow-blue); }
</style>
<text x="450" y="55" class="title" text-anchor="middle" >Motor de CC con escobillas</text><rect x="35" y="85" width="830" height="570" rx="24" class="panel"/><text x="450" y="125" class="panel-title" text-anchor="middle" >Vista transversal: campo, rotor y devanado</text><circle cx="450" cy="355" r="190" fill="#f5f6f7" stroke="#59636e" stroke-width="28"/><path d="M282 255 A190 190 0 0 0 282 455 L350 420 A115 115 0 0 1 350 290 Z" fill="url(#hatch-n)" stroke="#3d6694" stroke-width="5"/><path d="M618 255 A190 190 0 0 1 618 455 L550 420 A115 115 0 0 0 550 290 Z" fill="url(#hatch-s)" stroke="#943d48" stroke-width="5"/><text x="300" y="365" class="title" text-anchor="middle" >N</text><text x="600" y="365" class="title" text-anchor="middle" >S</text><circle cx="450" cy="355" r="105" fill="#e9ecef" stroke="#20252b" stroke-width="6"/><circle cx="450" cy="355" r="30" fill="#fff" stroke="#20252b" stroke-width="6"/><rect x="330" y="145" width="240" height="52" rx="13" fill="#fff" stroke="#3d6694" stroke-width="3"/><text x="450" y="180" class="small" text-anchor="middle" style="fill:#3d6694;font-weight:700">campo magnético B</text><path d="M340 220 H560" class="arrow-blue" style="stroke-width:9"/><text x="450" y="362" class="small" text-anchor="middle" >EJE</text><circle cx="405" cy="300" r="27" fill="#fbf3e4" stroke="#9b681c" stroke-width="7"/><circle cx="405" cy="300" r="19" fill="#fff" stroke="#20252b" stroke-width="5"/><circle cx="405" cy="300" r="6" fill="#20252b"/><circle cx="495" cy="410" r="27" fill="#fbf3e4" stroke="#9b681c" stroke-width="7"/><circle cx="495" cy="410" r="19" fill="#fff" stroke="#20252b" stroke-width="5"/><path d="M484 399 L506 421 M506 399 L484 421" fill="none" stroke="#20252b" stroke-width="5" stroke-linecap="round"/><g><rect x="70" y="145" width="250" height="78" rx="14" fill="#fff" stroke="#e4c8cc" stroke-width="3"/><text x="195" y="177" class="small" text-anchor="middle"><tspan x="195" dy="0">Estátor</tspan><tspan x="195" dy="27">(parte fija)</tspan></text><path d="M320 184 L310 220" class="leader"/><circle cx="310" cy="220" r="6" fill="#752933"/></g><g><rect x="580" y="145" width="245" height="78" rx="14" fill="#fff" stroke="#e4c8cc" stroke-width="3"/><text x="702" y="177" class="small" text-anchor="middle"><tspan x="702" dy="0">Imanes</tspan><tspan x="702" dy="27">permanentes</tspan></text><path d="M580 184 L610 275" class="leader"/><circle cx="610" cy="275" r="6" fill="#752933"/></g><g><rect x="70" y="500" width="250" height="48" rx="14" fill="#fff" stroke="#e4c8cc" stroke-width="3"/><text x="195" y="532" class="small" text-anchor="middle"><tspan x="195" dy="0">Rotor o inducido</tspan></text><path d="M195 500 L370 430" class="leader"/><circle cx="370" cy="430" r="6" fill="#752933"/></g><g><rect x="580" y="500" width="245" height="78" rx="14" fill="#fff" stroke="#e4c8cc" stroke-width="3"/><text x="702" y="532" class="small" text-anchor="middle"><tspan x="702" dy="0">Tramos axiales</tspan><tspan x="702" dy="27">del devanado</tspan></text><path d="M702 500 L518 432" class="leader"/><circle cx="518" cy="432" r="6" fill="#752933"/></g><circle cx="165" cy="620" r="15" fill="#fff" stroke="#20252b" stroke-width="3"/><circle cx="165" cy="620" r="5" fill="#20252b"/><text x="190" y="627" class="tiny" text-anchor="start" >corriente que sale del plano</text><circle cx="555" cy="620" r="15" fill="#fff" stroke="#20252b" stroke-width="3"/><path d="M545 610 L565 630 M565 610 L545 630" fill="none" stroke="#20252b" stroke-width="3" stroke-linecap="round"/><text x="580" y="627" class="tiny" text-anchor="start" >corriente que entra</text><rect x="35" y="690" width="830" height="330" rx="24" class="panel"/><text x="450" y="735" class="panel-title" text-anchor="middle" >Vista oblicua: bobina completa sobre el rotor</text><path d="M130 905 L770 830" stroke="#59636e" stroke-width="8" stroke-linecap="round"/><path d="M270 840 L600 802 L625 905 L295 947 Z" fill="#e9ecef" stroke="#20252b" stroke-width="5"/><text x="450" y="885" class="small" text-anchor="middle" >rotor</text><path d="M240 825 L625 780 L645 925 L260 970 Z" fill="none" stroke="#9b681c" stroke-width="12" stroke-linejoin="round"/><text x="360" y="820" class="label" text-anchor="middle" >A</text><text x="500" y="965" class="label" text-anchor="middle" >B</text><text x="225" y="910" class="tiny" text-anchor="middle" >cabeza</text><text x="660" y="860" class="tiny" text-anchor="middle" >cabeza</text><text x="735" y="860" class="small" text-anchor="middle" >eje</text><path d="M430 803 L478 797 L498 945 L450 951 Z" fill="#eff3f8" fill-opacity="0.78" stroke="#3d6694" stroke-width="3" stroke-dasharray="8 6"/><text x="464" y="988" class="tiny" text-anchor="middle" >plano de corte</text><text x="450" y="1006" class="tiny" text-anchor="middle" >A y B son los lados largos; las cabezas cierran la bobina fuera del corte.</text><rect x="35" y="1040" width="830" height="485" rx="24" class="panel"/><text x="450" y="1085" class="panel-title" text-anchor="middle" >Vista longitudinal: colector y escobillas</text><path d="M120 1270 H785" class="wire"/><rect x="210" y="1185" width="210" height="170" rx="30" fill="#e9ecef" stroke="#20252b" stroke-width="6"/><rect x="255" y="1215" width="120" height="110" rx="24" fill="none" stroke="#9b681c" stroke-width="12"/><path d="M500 1205 A70 70 0 0 1 500 1335 L535 1305 A32 32 0 0 0 535 1235 Z" fill="#c47a24" stroke="#20252b" stroke-width="5"/><path d="M500 1335 A70 70 0 0 1 500 1205 L465 1235 A32 32 0 0 0 465 1305 Z" fill="#e5a653" stroke="#20252b" stroke-width="5"/><rect x="548" y="1140" width="72" height="92" rx="8" fill="#4f555b" stroke="#20252b" stroke-width="5"/><rect x="548" y="1308" width="72" height="92" rx="8" fill="#4f555b" stroke="#20252b" stroke-width="5"/><path d="M620 1185 H755 M620 1355 H755" class="wire"/><text x="775" y="1192" class="title" text-anchor="middle" >+</text><text x="775" y="1365" class="title" text-anchor="middle" >−</text><g><rect x="70" y="1115" width="230" height="48" rx="14" fill="#fff" stroke="#e4c8cc" stroke-width="3"/><text x="185" y="1147" class="small" text-anchor="middle"><tspan x="185" dy="0">Eje</tspan></text><path d="M300 1139 L180 1270" class="leader"/><circle cx="180" cy="1270" r="6" fill="#752933"/></g><g><rect x="330" y="1115" width="260" height="78" rx="14" fill="#fff" stroke="#e4c8cc" stroke-width="3"/><text x="460" y="1147" class="small" text-anchor="middle"><tspan x="460" dy="0">Colector</tspan><tspan x="460" dy="27">de dos delgas</tspan></text><path d="M460 1193 L505 1200" class="leader"/><circle cx="505" cy="1200" r="6" fill="#752933"/></g><g><rect x="605" y="1115" width="225" height="78" rx="14" fill="#fff" stroke="#e4c8cc" stroke-width="3"/><text x="717" y="1147" class="small" text-anchor="middle"><tspan x="717" dy="0">Escobillas</tspan><tspan x="717" dy="27">fijas</tspan></text><path d="M605 1154 L585 1180" class="leader"/><circle cx="585" cy="1180" r="6" fill="#752933"/></g><text x="450" y="1460" class="small" text-anchor="middle"><tspan x="450" dy="0">Las delgas giran con el eje.</tspan><tspan x="450" dy="29">Las escobillas permanecen fijas y alimentan el rotor.</tspan></text>
</svg>
