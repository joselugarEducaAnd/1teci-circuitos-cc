  </marker>
  <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#3d6694"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#417e72"/>
  </marker>
  <pattern id="hatch-n" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="12" height="12" fill="#eff3f8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#3d6694" stroke-width="3"/>
  </pattern>
  <pattern id="hatch-s" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="12" height="12" fill="#f8eff0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#943d48" stroke-width="3"/>
  </pattern>
</defs>
