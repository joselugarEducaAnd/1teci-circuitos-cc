<title id="svg-title">Circuitos equivalentes de un motor de corriente continua</title>
<desc id="svg-desc">Dos circuitos con la misma fuente externa y la misma resistencia de inducido. En el arranque la fuerza contraelectromotriz es casi cero y la corriente es muy alta. Durante el giro aparece una fuente interna E con polaridad opuesta a V.</desc>
