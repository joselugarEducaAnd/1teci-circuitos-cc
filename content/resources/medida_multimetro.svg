<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" role="img" aria-labelledby="mm-title mm-desc" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="mm-title">Conexión del voltímetro, del amperímetro y del óhmetro</title>
<desc id="mm-desc">Tres esquemas. Primero, una pila alimenta una resistencia y un voltímetro se conecta en paralelo con la resistencia. Segundo, el mismo circuito con un amperímetro intercalado en serie. Tercero, una resistencia desconectada del circuito con un óhmetro conectado a sus dos terminales.</desc>
<style>
  text { font-family: "Atkinson Hyperlegible", "DejaVu Sans", "Liberation Sans", Arial, Helvetica, sans-serif; fill: #20252b; }
  .panel-title { font-size: 29px; font-weight: 700; }
  .label { font-size: 27px; font-weight: 600; }
  .meter-letter { font-size: 34px; font-weight: 700; fill: #3d6694; }
  .wire { fill: none; stroke: #20252b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .component { fill: #ffffff; stroke: #20252b; stroke-width: 5; }
  .plate { stroke: #20252b; stroke-linecap: butt; }
  .meter { fill: #eff3f8; stroke: #3d6694; stroke-width: 5; }
  .node { fill: #20252b; }
  .panel { fill: #ffffff; stroke: #e4c8cc; stroke-width: 4; }
</style>

<!-- 1 · Tensión: voltímetro en paralelo con R -->
<rect x="40" y="40" width="820" height="330" rx="24" class="panel"/>
<text x="70" y="88" class="panel-title">Medida de tensión</text>
<g transform="translate(40,40)">
  <polyline class="wire" points="180,205 180,150 360,150"/>
  <polyline class="wire" points="480,150 640,150 640,290 180,290 180,250"/>
  <line class="plate" x1="150" y1="205" x2="210" y2="205" stroke-width="5"/>
  <line class="plate" x1="166" y1="225" x2="194" y2="225" stroke-width="11"/>
  <line class="wire" x1="180" y1="225" x2="180" y2="250"/>
  <text x="218" y="200" class="label">+</text>
  <rect x="360" y="130" width="120" height="40" class="component"/>
  <text x="420" y="215" class="label" text-anchor="middle">R</text>
  <polyline class="wire" points="320,150 320,90 390,90"/>
  <polyline class="wire" points="450,90 520,90 520,150"/>
  <circle cx="320" cy="150" r="8" class="node"/>
  <circle cx="520" cy="150" r="8" class="node"/>
  <circle cx="420" cy="90" r="30" class="meter"/>
  <text x="420" y="102" class="meter-letter" text-anchor="middle">V</text>
</g>

<!-- 2 · Intensidad: amperímetro en serie -->
<rect x="40" y="410" width="820" height="330" rx="24" class="panel"/>
<text x="70" y="458" class="panel-title">Medida de intensidad</text>
<g transform="translate(40,410)">
  <polyline class="wire" points="180,205 180,150 360,150"/>
  <polyline class="wire" points="480,150 640,150 640,190"/>
  <polyline class="wire" points="640,250 640,290 180,290 180,250"/>
  <line class="plate" x1="150" y1="205" x2="210" y2="205" stroke-width="5"/>
  <line class="plate" x1="166" y1="225" x2="194" y2="225" stroke-width="11"/>
  <line class="wire" x1="180" y1="225" x2="180" y2="250"/>
  <text x="218" y="200" class="label">+</text>
  <rect x="360" y="130" width="120" height="40" class="component"/>
  <text x="420" y="215" class="label" text-anchor="middle">R</text>
  <circle cx="640" cy="220" r="30" class="meter"/>
  <text x="640" y="232" class="meter-letter" text-anchor="middle">A</text>
</g>

<!-- 3 · Resistencia: óhmetro sobre R aislada -->
<rect x="40" y="780" width="820" height="330" rx="24" class="panel"/>
<text x="70" y="828" class="panel-title">Medida de resistencia</text>
<g transform="translate(30,780)">
  <polyline class="wire" points="360,210 300,210 300,120 390,120"/>
  <polyline class="wire" points="480,210 540,210 540,120 450,120"/>
  <rect x="360" y="190" width="120" height="40" class="component"/>
  <text x="420" y="275" class="label" text-anchor="middle">R</text>
  <circle cx="420" cy="120" r="30" class="meter"/>
  <text x="420" y="132" class="meter-letter" text-anchor="middle">Ω</text>
</g>
</svg>
