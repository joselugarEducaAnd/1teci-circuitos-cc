<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1730"
 role="img" aria-labelledby="svg-title svg-desc" preserveAspectRatio="xMidYMid meet">
<title id="svg-title">Secuencia de conmutación de un motor de corriente continua</title>
<desc id="svg-desc">Una vista oblicua inicial muestra la bobina completa, sus dos tramos axiales A y B, las cabezas que los unen, el eje y el plano de corte. A su lado se representa el corte transversal resultante. Debajo, tres estados muestran A y B fijados al rotor: el punto significa corriente axial saliente y la cruz corriente axial entrante. Al girar un cuarto y media vuelta, A y B intercambian su posición y el colector invierte la corriente para mantener un par horario.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#752933"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#3d6694"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#417e72"/>
  </marker>
  <pattern id="hatch-n" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="12" height="12" fill="#eff3f8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#3d6694" stroke-width="3"/>
  </pattern>
  <pattern id="hatch-s" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="12" height="12" fill="#f8eff0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#943d48" stroke-width="3"/>
  </pattern>
</defs>
<style>
  text { font-family: "Atkinson Hyperlegible", Arial, sans-serif; fill: #20252b; }
  .title { font-size: 38px; font-weight: 700; }
  .panel-title { font-size: 29px; font-weight: 700; }
  .label { font-size: 25px; font-weight: 600; }
  .body { font-size: 23px; }
  .small { font-size: 20px; }
  .tiny { font-size: 18px; }
  .wire { fill: none; stroke: #20252b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .component { fill: #ffffff; stroke: #20252b; stroke-width: 5; }
  .accent { fill: #f8eff0; stroke: #752933; stroke-width: 5; }
  .blue { fill: #eff3f8; stroke: #3d6694; stroke-width: 5; }
  .teal { fill: #f0f7f6; stroke: #417e72; stroke-width: 5; }
  .panel { fill: #ffffff; stroke: #e4c8cc; stroke-width: 4; }
  .leader { fill: none; stroke: #59636e; stroke-width: 3; stroke-linecap: round; }
  .arrow { fill: none; stroke: #752933; stroke-width: 6; marker-end: url(#arrow); }
  .arrow-blue { fill: none; stroke: #3d6694; stroke-width: 6; marker-end: url(#arrow-blue); }
  .arrow-teal { fill: none; stroke: #417e72; stroke-width: 6; marker-end: url(#arrow-teal); }
  .control { fill: none; stroke: #3d6694; stroke-width: 4; stroke-dasharray: 13 10; marker-end: url(#arrow-blue); }
</style>
<text x="450" y="55" class="title" text-anchor="middle" >La conmutación mantiene el sentido del par</text><defs><marker id="arrow-gold" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#9b681c"/></marker></defs><rect x="45" y="85" width="810" height="285" rx="22" class="blue"/><text x="450" y="122" class="panel-title" text-anchor="middle" >De la bobina completa al corte transversal</text><text x="285" y="157" class="small" text-anchor="middle" >Bobina completa (vista oblicua)</text><text x="690" y="157" class="small" text-anchor="middle" >Corte en zona neutra</text><path d="M285 168 L335 157 L335 290 L285 301 Z" fill="#eff3f8" fill-opacity="0.82" stroke="#3d6694" stroke-width="3" stroke-dasharray="8 6"/><path d="M135 270 L455 195" stroke="#59636e" stroke-width="7" stroke-linecap="round"/><text x="150" y="292" class="small" text-anchor="start" >eje</text><path d="M175 210 L420 153 L420 258 L175 315 Z" fill="none" stroke="#9b681c" stroke-width="11" stroke-linejoin="round"/><text x="250" y="177" class="label" text-anchor="middle" >A</text><text x="340" y="310" class="label" text-anchor="middle" >B</text><path d="M365 166 L225 198" fill="none" stroke="#9b681c" stroke-width="6" marker-end="url(#arrow-gold)"/><path d="M225 303 L365 270" fill="none" stroke="#9b681c" stroke-width="6" marker-end="url(#arrow-gold)"/><text x="350" y="190" class="small" text-anchor="middle" >I</text><text x="240" y="286" class="small" text-anchor="middle" >I</text><text x="310" y="337" class="small" text-anchor="middle" >plano de corte</text><path d="M475 230 H555" class="arrow-blue"/><text x="515" y="216" class="small" text-anchor="middle" >mirar por el eje</text><circle cx="690" cy="245" r="73" fill="#f5f6f7" stroke="#59636e" stroke-width="5"/><circle cx="690" cy="245" r="15" fill="#fff" stroke="#20252b" stroke-width="4"/><circle cx="690" cy="200" r="25" fill="#fbf3e4" stroke="#9b681c" stroke-width="6"/><circle cx="690" cy="200" r="19" fill="#fff" stroke="#20252b" stroke-width="5"/><circle cx="690" cy="200" r="6" fill="#20252b"/><circle cx="690" cy="290" r="25" fill="#fbf3e4" stroke="#9b681c" stroke-width="6"/><circle cx="690" cy="290" r="19" fill="#fff" stroke="#20252b" stroke-width="5"/><path d="M679 279 L701 301 M701 279 L679 301" fill="none" stroke="#20252b" stroke-width="5" stroke-linecap="round"/><text x="730" y="208" class="label" text-anchor="start" >A</text><text x="730" y="298" class="label" text-anchor="start" >B</text><text x="450" y="360" class="small" text-anchor="middle" >Cabezas = lados cortos  ·  tramos axiales A/B = lados largos</text><rect x="35" y="390" width="830" height="360" rx="24" class="panel"/><text x="70" y="436" class="panel-title" text-anchor="start" >1</text><text x="450" y="436" class="panel-title" text-anchor="middle" >Antes de la conmutación</text><rect x="115" y="485" width="105" height="210" rx="10" fill="url(#hatch-n)" stroke="#3d6694" stroke-width="5"/><rect x="680" y="485" width="105" height="210" rx="10" fill="url(#hatch-s)" stroke="#943d48" stroke-width="5"/><text x="168" y="605" class="title" text-anchor="middle" >N</text><text x="732" y="605" class="title" text-anchor="middle" >S</text><path d="M245 472 H645" class="arrow-blue"/><text x="450" y="462" class="small" text-anchor="middle" style="fill:#3d6694;font-weight:700">campo B</text><circle cx="450" cy="595" r="108" fill="#f5f6f7" stroke="#59636e" stroke-width="5"/><circle cx="450" cy="595" r="18" fill="#fff" stroke="#20252b" stroke-width="5"/><circle cx="375" cy="595" r="29" fill="#fbf3e4" stroke="#9b681c" stroke-width="7"/><circle cx="375" cy="595" r="22" fill="#fff" stroke="#20252b" stroke-width="5"/><circle cx="375" cy="595" r="7" fill="#20252b"/><circle cx="525" cy="595" r="29" fill="#fbf3e4" stroke="#9b681c" stroke-width="7"/><circle cx="525" cy="595" r="22" fill="#fff" stroke="#20252b" stroke-width="5"/><path d="M512 582 L538 608 M538 582 L512 608" fill="none" stroke="#20252b" stroke-width="5" stroke-linecap="round"/><text x="375" y="650" class="label" text-anchor="middle" >A</text><text x="525" y="650" class="label" text-anchor="middle" >B</text><path d="M325 660 V530" class="arrow-teal"/><path d="M575 530 V660" class="arrow-teal"/><text x="300" y="533" class="label" text-anchor="middle" >F</text><text x="600" y="677" class="label" text-anchor="middle" >F</text><path d="M590 707 A170 72 0 0 1 310 707" class="arrow"/><text x="450" y="677" class="small" text-anchor="middle" >par horario</text><rect x="35" y="770" width="830" height="360" rx="24" class="panel"/><text x="70" y="816" class="panel-title" text-anchor="start" >2</text><text x="450" y="816" class="panel-title" text-anchor="middle" >Zona neutra: cambio de contacto</text><rect x="115" y="865" width="105" height="210" rx="10" fill="url(#hatch-n)" stroke="#3d6694" stroke-width="5"/><rect x="680" y="865" width="105" height="210" rx="10" fill="url(#hatch-s)" stroke="#943d48" stroke-width="5"/><text x="168" y="985" class="title" text-anchor="middle" >N</text><text x="732" y="985" class="title" text-anchor="middle" >S</text><path d="M245 852 H645" class="arrow-blue"/><text x="450" y="842" class="small" text-anchor="middle" style="fill:#3d6694;font-weight:700">campo B</text><circle cx="450" cy="975" r="108" fill="#f5f6f7" stroke="#59636e" stroke-width="5"/><circle cx="450" cy="975" r="18" fill="#fff" stroke="#20252b" stroke-width="5"/><circle cx="450" cy="900" r="29" fill="#fbf3e4" stroke="#9b681c" stroke-width="7"/><circle cx="450" cy="1050" r="29" fill="#fbf3e4" stroke="#9b681c" stroke-width="7"/><text x="450" y="909" class="label" text-anchor="middle" >A</text><text x="450" y="1059" class="label" text-anchor="middle" >B</text><text x="450" y="1107" class="small" text-anchor="middle" >conmutación: A  ⊙→⊗   ·   B  ⊗→⊙   ·   par ≈ 0</text><rect x="35" y="1150" width="830" height="360" rx="24" class="panel"/><text x="70" y="1196" class="panel-title" text-anchor="start" >3</text><text x="450" y="1196" class="panel-title" text-anchor="middle" >Después de media vuelta</text><rect x="115" y="1245" width="105" height="210" rx="10" fill="url(#hatch-n)" stroke="#3d6694" stroke-width="5"/><rect x="680" y="1245" width="105" height="210" rx="10" fill="url(#hatch-s)" stroke="#943d48" stroke-width="5"/><text x="168" y="1365" class="title" text-anchor="middle" >N</text><text x="732" y="1365" class="title" text-anchor="middle" >S</text><path d="M245 1232 H645" class="arrow-blue"/><text x="450" y="1222" class="small" text-anchor="middle" style="fill:#3d6694;font-weight:700">campo B</text><circle cx="450" cy="1355" r="108" fill="#f5f6f7" stroke="#59636e" stroke-width="5"/><circle cx="450" cy="1355" r="18" fill="#fff" stroke="#20252b" stroke-width="5"/><circle cx="375" cy="1355" r="29" fill="#fbf3e4" stroke="#9b681c" stroke-width="7"/><circle cx="375" cy="1355" r="22" fill="#fff" stroke="#20252b" stroke-width="5"/><circle cx="375" cy="1355" r="7" fill="#20252b"/><circle cx="525" cy="1355" r="29" fill="#fbf3e4" stroke="#9b681c" stroke-width="7"/><circle cx="525" cy="1355" r="22" fill="#fff" stroke="#20252b" stroke-width="5"/><path d="M512 1342 L538 1368 M538 1342 L512 1368" fill="none" stroke="#20252b" stroke-width="5" stroke-linecap="round"/><text x="375" y="1410" class="label" text-anchor="middle" >B</text><text x="525" y="1410" class="label" text-anchor="middle" >A</text><path d="M325 1420 V1290" class="arrow-teal"/><path d="M575 1290 V1420" class="arrow-teal"/><text x="300" y="1293" class="label" text-anchor="middle" >F</text><text x="600" y="1437" class="label" text-anchor="middle" >F</text><path d="M590 1467 A170 72 0 0 1 310 1467" class="arrow"/><text x="450" y="1437" class="small" text-anchor="middle" >par horario</text><rect x="55" y="1530" width="790" height="170" rx="20" class="teal"/><text x="450" y="1570" class="body" text-anchor="middle"><tspan x="450" dy="0">A y B son los mismos tramos axiales, fijados al rotor.</tspan><tspan x="450" dy="33">Tras media vuelta intercambian su posición y el colector invierte I.</tspan><tspan x="450" dy="33">Con F = I·ℓ × B, las fuerzas mantienen el par horario.</tspan><tspan x="450" dy="33">Las cabezas de bobina cierran el circuito fuera del plano de corte.</tspan></text>
</svg>
