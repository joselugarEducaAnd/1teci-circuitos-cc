</svg><text x="95" y="205" class="label" text-anchor="start" >+V motor</text><text x="95" y="650" class="label" text-anchor="start" >0 V</text><path d="M280 410 H355 M545 410 H620" class="wire"/><circle cx="450" cy="410" r="95" fill="#fff" stroke="#752933" stroke-width="7"/><text x="450" y="390" class="title" text-anchor="middle" >M</text><text x="450" y="440" class="small" text-anchor="middle" >motor CC</text><text x="227" y="268" class="label" text-anchor="middle" style="fill:#752933">S1</text><text x="673" y="268" class="label" text-anchor="middle" style="fill:#3d6694">S2</text><text x="227" y="563" class="label" text-anchor="middle" style="fill:#3d6694">S3</text><text x="673" y="563" class="label" text-anchor="middle" style="fill:#752933">S4</text><path d="M205 690 H265" fill="none" stroke="#752933" stroke-width="8" stroke-linecap="round"/><path d="M205 730 H265" fill="none" stroke="#3d6694" stroke-width="6" stroke-dasharray="12 8"/><path d="M365 410 H535" class="arrow"/><text x="585" y="400" class="label" text-anchor="middle" >I</text><text x="535" y="700" class="body" text-anchor="middle" >S1 + S4: corriente izquierda → derecha</text><text x="535" y="740" class="body" text-anchor="middle" >S2 + S3: corriente derecha → izquierda</text><rect x="90" y="835" width="720" height="260" rx="24" class="blue"/><text x="450" y="885" class="panel-title" text-anchor="middle" >Control lógico</text><rect x="145" y="930" width="230" height="95" rx="16" fill="#fff" stroke="#3d6694" stroke-width="4"/><text x="260" y="965" class="small" text-anchor="middle"><tspan x="260" dy="0">PWM</tspan><tspan x="260" dy="28">regula velocidad</tspan></text><rect x="525" y="930" width="230" height="95" rx="16" fill="#fff" stroke="#3d6694" stroke-width="4"/><text x="640" y="965" class="small" text-anchor="middle"><tspan x="640" dy="0">DIR</tspan><tspan x="640" dy="28">elige diagonal</tspan></text><path d="M260 930 V800 H360" class="control"/><path d="M640 930 V800 H540" class="control"/><rect x="70" y="1135" width="760" height="175" rx="20" class="accent"/><text x="450" y="1180" class="body" text-anchor="middle"><tspan x="450" dy="0">La señal lógica solo ordena.</tspan><tspan x="450" dy="36">La alimentación del motor entrega la potencia.</tspan><tspan x="450" dy="36">Nunca se cierran S1+S3 ni S2+S4: cortocircuitarían la fuente.</tspan></text>
</svg>
