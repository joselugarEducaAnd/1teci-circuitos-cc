<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1150"
 role="img" aria-labelledby="svg-title svg-desc" preserveAspectRatio="xMidYMid meet">
<title id="svg-title">Curvas cualitativas de un motor de corriente continua</title>
<desc id="svg-desc">La primera gráfica muestra que el par electromagnético aumenta linealmente con la corriente. La segunda muestra que, a tensión constante, la velocidad disminuye cuando aumenta el par, desde el vacío hasta el bloqueo. No se emplea escala numérica.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#752933"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#3d6694"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 Z" fill="#417e72"/>
  </marker>
  <pattern id="hatch-n" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="12" height="12" fill="#eff3f8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#3d6694" stroke-width="3"/>
  </pattern>
  <pattern id="hatch-s" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="12" height="12" fill="#f8eff0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#943d48" stroke-width="3"/>
  </pattern>
</defs>
<style>
  text { font-family: "Atkinson Hyperlegible", Arial, sans-serif; fill: #20252b; }
  .title { font-size: 38px; font-weight: 700; }
  .panel-title { font-size: 29px; font-weight: 700; }
  .label { font-size: 25px; font-weight: 600; }
  .body { font-size: 23px; }
  .small { font-size: 20px; }
  .tiny { font-size: 18px; }
  .wire { fill: none; stroke: #20252b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .component { fill: #ffffff; stroke: #20252b; stroke-width: 5; }
  .accent { fill: #f8eff0; stroke: #752933; stroke-width: 5; }
  .blue { fill: #eff3f8; stroke: #3d6694; stroke-width: 5; }
  .teal { fill: #f0f7f6; stroke: #417e72; stroke-width: 5; }
  .panel { fill: #ffffff; stroke: #e4c8cc; stroke-width: 4; }
  .leader { fill: none; stroke: #59636e; stroke-width: 3; stroke-linecap: round; }
  .arrow { fill: none; stroke: #752933; stroke-width: 6; marker-end: url(#arrow); }
  .arrow-blue { fill: none; stroke: #3d6694; stroke-width: 6; marker-end: url(#arrow-blue); }
  .arrow-teal { fill: none; stroke: #417e72; stroke-width: 6; marker-end: url(#arrow-teal); }
  .control { fill: none; stroke: #3d6694; stroke-width: 4; stroke-dasharray: 13 10; marker-end: url(#arrow-blue); }
</style>
<text x="450" y="55" class="title" text-anchor="middle" >Relaciones cualitativas a tensión constante</text><rect x="40" y="80" width="820" height="420" rx="24" class="panel"/><text x="450" y="130" class="panel-title" text-anchor="middle" >Par frente a corriente</text><path d="M155 425 V185 M155 425 H760" class="wire"/><path d="M155 185 l-10 18 h20 z" fill="#20252b"/><path d="M760 425 l-18 -10 v20 z" fill="#20252b"/><rect x="40" y="560" width="820" height="420" rx="24" class="panel"/><text x="450" y="610" class="panel-title" text-anchor="middle" >Velocidad frente a par</text><path d="M155 905 V665 M155 905 H760" class="wire"/><path d="M155 665 l-10 18 h20 z" fill="#20252b"/><path d="M760 905 l-18 -10 v20 z" fill="#20252b"/><path d="M175 405 L710 175" fill="none" stroke="#752933" stroke-width="7"/><circle cx="480" cy="274" r="12" fill="#752933"/><text x="505" y="270" class="small" text-anchor="start" >punto de trabajo</text><text x="125" y="185" class="label" text-anchor="middle"><tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="70%">e</tspan></text><text x="730" y="465" class="label" text-anchor="middle" >I</text><text x="450" y="480" class="body" text-anchor="middle"><tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="70%">e</tspan><tspan> = </tspan><tspan font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="70%">t</tspan><tspan> · </tspan><tspan font-style="italic">I</tspan></text><path d="M185 700 L710 895" fill="none" stroke="#3d6694" stroke-width="7"/><circle cx="185" cy="700" r="12" fill="#3d6694"/><circle cx="470" cy="806" r="12" fill="#3d6694"/><circle cx="710" cy="895" r="12" fill="#3d6694"/><text x="215" y="685" class="small" text-anchor="start">vacío · <tspan font-style="italic">ω</tspan><tspan baseline-shift="sub" font-size="70%">0</tspan></text><text x="495" y="798" class="small" text-anchor="start" >punto nominal</text><text x="675" y="930" class="small" text-anchor="middle" >bloqueo</text><text x="125" y="675" class="label" text-anchor="middle" >ω</text><text x="730" y="945" class="label" text-anchor="middle"><tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="70%">e</tspan></text><rect x="75" y="1010" width="750" height="105" rx="18" class="accent"/><text x="450" y="1050" class="small" text-anchor="middle"><tspan x="450" dy="0">Tendencias cualitativas, sin escala numérica.</tspan><tspan x="450" dy="31">Los puntos exactos dependen del motor y de la tensión aplicada.</tspan></text>
</svg>
